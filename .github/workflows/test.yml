name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e .[test]
      - name: Run tests with coverage
        run: pytest --cov=dqt --cov-report=term-missing --cov-report=xml -v
      - name: Check packaged Dash assets
        if: matrix.python-version == '3.12'
        run: |
          pip wheel --no-deps . -w dist
          python -c "import glob, zipfile; assert 'dqt/app/assets/base.css' in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()"
      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
